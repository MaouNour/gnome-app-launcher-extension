<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Squircle Background Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181B30"/>
      <stop offset="60%" stop-color="#0B0C16"/>
      <stop offset="100%" stop-color="#030306"/>
    </radialGradient>

    <!-- Edge Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="40%" stop-color="#0072FF"/>
      <stop offset="75%" stop-color="#923CB5"/>
      <stop offset="100%" stop-color="#E028B7"/>
    </linearGradient>

    <!-- Glossy Glass Overlay -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Tux Body Main Gradient -->
    <linearGradient id="tuxBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252C3A"/>
      <stop offset="50%" stop-color="#0F1118"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>

    <!-- Neon Edge Outline -->
    <linearGradient id="tuxEdgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A88FF"/>
      <stop offset="50%" stop-color="#9A4BFF"/>
      <stop offset="100%" stop-color="#E542FF"/>
    </linearGradient>

    <!-- Tux Belly Gradient -->
    <linearGradient id="tuxBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#B0C2DE"/>
    </linearGradient>

    <!-- Beak & Feet Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="60%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#E66800"/>
    </linearGradient>

    <linearGradient id="footHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame (Replaces Circle) -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#rimGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="98" fill="url(#darkBg)"/>

  <!-- Top Glass Highlight -->
  <path d="M 40,160 C 80,60 180,30 290,32 C 380,34 442,80 470,140 C 350,200 200,220 40,160 Z" fill="url(#glassReflect)"/>

  <!-- ================= TUX PENGUIN (EDGE TO EDGE FULL FILL) ================= -->
  <g id="tux" transform="translate(256, 260) scale(1.38) translate(-256, -256)">

    <!-- Outer Neon Specular -->
    <path d="M 256,92 C 185,92 165,150 165,220 C 165,280 120,330 115,380 C 110,430 180,442 256,442 C 332,442 402,430 397,380 C 392,330 347,280 347,220 C 347,150 327,92 256,92 Z" 
          fill="none" stroke="url(#tuxEdgeGlow)" stroke-width="7" opacity="0.85"/>

    <!-- Main Body -->
    <path d="M 256,96 C 188,96 168,152 168,222 C 168,282 125,332 120,378 C 115,425 182,438 256,438 C 330,438 397,425 392,378 C 387,332 344,282 344,222 C 344,152 324,96 256,96 Z" 
          fill="url(#tuxBodyGrad)"/>

    <!-- Wings Shadow -->
    <path d="M 168,222 C 150,260 130,310 122,360 C 140,320 160,270 176,230 Z" fill="#000000" opacity="0.4"/>
    <path d="M 344,222 C 362,260 382,310 390,360 C 372,320 352,270 336,230 Z" fill="#000000" opacity="0.4"/>

    <!-- White Belly -->
    <path d="M 256,212 C 210,212 182,250 182,320 C 182,382 212,414 256,414 C 300,414 330,382 330,320 C 330,250 302,212 256,212 Z" 
          fill="url(#tuxBellyGrad)"/>
    <path d="M 256,212 C 295,212 324,250 324,320 C 324,375 298,408 256,410 C 290,405 316,370 316,320 C 316,255 290,218 256,218 Z" fill="#94A3B8" opacity="0.3"/>

    <!-- Eyes -->
    <ellipse cx="224" cy="168" rx="20" ry="28" fill="#FFFFFF"/>
    <ellipse cx="288" cy="168" rx="20" ry="28" fill="#FFFFFF"/>
    <ellipse cx="230" cy="170" rx="10" ry="16" fill="#0B0C16"/>
    <ellipse cx="282" cy="170" rx="10" ry="16" fill="#0B0C16"/>
    <circle cx="227" cy="162" r="4" fill="#FFFFFF"/>
    <circle cx="279" cy="162" r="4" fill="#FFFFFF"/>
    <circle cx="233" cy="174" r="2" fill="#FFFFFF"/>
    <circle cx="285" cy="174" r="2" fill="#FFFFFF"/>

    <!-- Beak -->
    <path d="M 210,186 C 210,186 232,174 256,174 C 280,174 302,186 302,186 C 306,204 288,224 256,224 C 224,224 206,204 210,186 Z" fill="url(#beakGrad)"/>
    <path d="M 214,188 C 236,198 276,198 298,188" stroke="#D65100" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 226,180 C 242,176 270,176 286,180 C 274,183 238,183 226,180 Z" fill="#FFEAA7" opacity="0.8"/>

    <!-- Feet -->
    <g id="leftFoot">
      <path d="M 120,380 C 120,380 160,352 210,366 C 228,372 234,402 210,428 C 180,452 130,442 120,412 C 115,398 116,386 120,380 Z" fill="url(#beakGrad)"/>
      <path d="M 130,385 C 160,365 195,372 208,376 C 190,370 155,368 130,385 Z" fill="url(#footHighlight)"/>
    </g>
    <g id="rightFoot">
      <path d="M 392,380 C 392,380 352,352 302,366 C 284,372 278,402 302,428 C 332,452 382,442 392,412 C 397,398 396,386 392,380 Z" fill="url(#beakGrad)"/>
      <path d="M 382,385 C 352,365 317,372 304,376 C 322,370 357,368 382,385 Z" fill="url(#footHighlight)"/>
    </g>

  </g>
</svg>
